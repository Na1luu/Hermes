</script>
<script>
// ═════════════════════════════════════════════════════════
// RESSOURCES (liens cloud configurables)
// ═════════════════════════════════════════════════════════

function updResource(idx, field, value) {
  state.resources[idx][field] = value;
  save('resources', state.resources);
  rerender();
}
function delResource(idx) {
  if (!confirm('Supprimer ce lien ?')) return;
  state.resources.splice(idx, 1);
  save('resources', state.resources);
  rerender();
}
function addResource() {
  state.resources.push({ name: 'Nouveau lien', url: '', category: 'Autre' });
  save('resources', state.resources);
  rerender();
}
function openResource(url) {
  if (!url || !url.startsWith('http')) {
    alert('Lien invalide. Configure d\'abord l\'URL dans Réglages → Ressources.');
    return;
  }
  window.open(url, '_blank', 'noopener,noreferrer');
}

// ═════════════════════════════════════════════════════════
// BACKUP / RESTORE
// ═════════════════════════════════════════════════════════

function exportJSON() {
  const all = {
    v: 7, at: new Date().toISOString(),
    apports: state.apports, benefs: state.benefs, produits: state.produits,
    achats: state.achats, trades: state.trades, profil: state.profil,
    monthly: state.monthly, resources: state.resources,
    courseProgress: state.courseProgress,
  };
  const blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `HERMES_backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click(); URL.revokeObjectURL(url);
}
function importJSON(e) {
  const f = e.target.files[0]; if (!f) return;
  if (!confirm('Restaurer ? Cela remplacera tes données actuelles.')) return;
  const r = new FileReader();
  r.onload = (ev) => {
    try {
      const d = JSON.parse(ev.target.result);
      ['apports','benefs','produits','achats','trades','profil','resources','courseProgress'].forEach(k => {
        if (Array.isArray(d[k])) { state[k] = d[k]; save(k, d[k]); }
      });
      if (typeof d.monthly === 'number') { state.monthly = d.monthly; save('monthly', d.monthly); }
      alert('✓ Données restaurées'); render();
    } catch (e) { alert('⚠ Fichier invalide : ' + e.message); }
  };
  r.readAsText(f);
}
function resetAll() {
  if (!confirm('⚠ ATTENTION : cela va effacer TOUTES tes données. As-tu fait une sauvegarde ?')) return;
  if (!confirm('Es-tu VRAIMENT sûr ? IRRÉVERSIBLE.')) return;
  Object.keys(STORAGE_KEYS).forEach(k => { try { localStorage.removeItem(STORAGE_KEYS[k]); } catch(e) {} });
  location.reload();
}

// ═════════════════════════════════════════════════════════
// RÉGLAGES
// ═════════════════════════════════════════════════════════

function renderReglages() {
  const cats = ['Cours', 'Annexes', 'Simulateurs', 'Brokers', 'Documents', 'Fiscalité', 'Autre'];
  
  return `
    <h1 class="page-title">⚙️ Réglages</h1>
    <p class="page-sub">Niveau · Accessibilité · Ressources · Backup · PWA</p>
    
    <h2 id="accessibilite">♿ Accessibilité</h2>
    <div class="card">
      <div class="card-title">Taille de texte</div>
      <p style="font-size:var(--fs-sm);color:var(--ink3);margin-bottom:var(--sp-3)">Ajuste la taille de tous les textes (utile pour la lecture).</p>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn ghost" onclick="setTextScale(0.85)" ${state.textScale === 0.85 ? 'style="border-color:var(--gold);color:var(--gold);font-weight:700"' : ''}>A petit (85%)</button>
        <button class="btn ghost" onclick="setTextScale(1)" ${state.textScale === 1 ? 'style="border-color:var(--gold);color:var(--gold);font-weight:700"' : ''}>A normal (100%)</button>
        <button class="btn ghost" onclick="setTextScale(1.15)" ${state.textScale === 1.15 ? 'style="border-color:var(--gold);color:var(--gold);font-weight:700"' : ''}>A grand (115%)</button>
        <button class="btn ghost" onclick="setTextScale(1.3)" ${state.textScale === 1.3 ? 'style="border-color:var(--gold);color:var(--gold);font-weight:700"' : ''}>A très grand (130%)</button>
      </div>
    </div>
    
    <div class="card">
      <div class="card-title">Contraste</div>
      <p style="font-size:var(--fs-sm);color:var(--ink3);margin-bottom:var(--sp-3)">Renforce les contrastes pour une meilleure lisibilité (malvoyants).</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost" onclick="setContrast('normal')" ${state.contrast === 'normal' ? 'style="border-color:var(--gold);color:var(--gold);font-weight:700"' : ''}>Normal</button>
        <button class="btn ghost" onclick="setContrast('high')" ${state.contrast === 'high' ? 'style="border-color:var(--gold);color:var(--gold);font-weight:700"' : ''}>Contraste élevé</button>
      </div>
    </div>
    
    <div class="card">
      <div class="card-title">Thème</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost" onclick="setTheme('light')" ${state.theme === 'light' ? 'style="border-color:var(--gold);color:var(--gold);font-weight:700"' : ''}>☀️ Clair</button>
        <button class="btn ghost" onclick="setTheme('dark')" ${state.theme === 'dark' ? 'style="border-color:var(--gold);color:var(--gold);font-weight:700"' : ''}>🌙 Sombre</button>
      </div>
    </div>
    
    <h2 id="niveau">🎓 Niveau d'expertise</h2>
    <div class="card">
      <p style="font-size:var(--fs-sm);color:var(--ink3);margin-bottom:var(--sp-3)">Adapte le contenu et les explications affichées dans l'app.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost" onclick="setLevel('debutant')" ${state.level === 'debutant' ? 'style="border-color:var(--gold);color:var(--gold);font-weight:700"' : ''}>📘 Débutant — explications détaillées</button>
        <button class="btn ghost" onclick="setLevel('intermediaire')" ${state.level === 'intermediaire' ? 'style="border-color:var(--gold);color:var(--gold);font-weight:700"' : ''}>📗 Intermédiaire</button>
        <button class="btn ghost" onclick="setLevel('expert')" ${state.level === 'expert' ? 'style="border-color:var(--gold);color:var(--gold);font-weight:700"' : ''}>📕 Expert — compact</button>
      </div>
    </div>
    
    <h2 id="ressources">🔗 Mes ressources</h2>
    <div class="notice gold">💡 Stocke ici tous tes liens cloud (Drive, brokers, simulateurs externes, annexes, fiscalité...). Modifiable à tout moment, sauvegardé avec ton backup JSON.</div>
    <div class="card">
      <table class="table responsive">
        <thead><tr><th>Nom</th><th>Catégorie</th><th>URL</th><th>Ouvrir</th><th></th></tr></thead>
        <tbody>
          ${state.resources.map((r, i) => `<tr>
            <td data-label="Nom"><input type="text" class="input" value="${escAttr(r.name)}" onchange="updResource(${i}, 'name', this.value)" aria-label="Nom ressource"></td>
            <td data-label="Catégorie"><select class="select" onchange="updResource(${i}, 'category', this.value)" aria-label="Catégorie">${cats.map(c => `<option value="${c}" ${r.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></td>
            <td data-label="URL"><input type="url" class="input" value="${escAttr(r.url)}" onchange="updResource(${i}, 'url', this.value)" placeholder="https://..." style="min-width:200px" aria-label="URL"></td>
            <td data-label="Ouvrir"><button class="btn sm" onclick="openResource('${escAttr(r.url)}')" ${!r.url || !r.url.startsWith('http') ? 'disabled' : ''}>🔗 Ouvrir</button></td>
            <td><button class="btn ghost sm" onclick="delResource(${i})" aria-label="Supprimer">✕</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div style="margin-top:12px">
        <button class="btn ghost sm" onclick="addResource()">+ Ajouter un lien</button>
      </div>
    </div>
    
    <h2>📱 Installer comme une app</h2>
    <div class="card">
      <p style="font-size:var(--fs-sm);color:var(--ink3);margin-bottom:var(--sp-3)">HERMES fonctionne comme une application installable sur ton téléphone ou ordinateur. Installe-la pour un accès rapide depuis ton écran d'accueil et un usage hors-ligne.</p>
      <button class="btn blue" onclick="installPWA()">📱 Installer HERMES</button>
      <div class="notice" style="margin-top:14px">
        <strong>iPhone/iPad :</strong> Safari → bouton Partager → "Sur l'écran d'accueil"<br>
        <strong>Android :</strong> Chrome → menu ⋮ → "Installer l'application"<br>
        <strong>Ordinateur :</strong> icône ⊕ dans la barre d'adresse
      </div>
    </div>
    
    <h2>📥 Sauvegarde & restauration</h2>
    <div class="card">
      <p style="font-size:var(--fs-sm);color:var(--ink3);margin-bottom:var(--sp-3)">Tes données sont stockées localement. Pour migrer entre appareils ou sauvegarder, exporte en JSON.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn green" onclick="exportJSON()">📥 Télécharger sauvegarde JSON</button>
        <label class="btn ghost" style="cursor:pointer">
          📤 Restaurer depuis JSON
          <input type="file" accept=".json" onchange="importJSON(event)" style="display:none">
        </label>
        <button class="btn ghost" style="color:var(--red);border-color:var(--red)" onclick="resetAll()">⚠ Réinitialiser tout</button>
      </div>
    </div>
    
    <h2>📊 Statistiques de données</h2>
    <div class="card">
      <table class="table responsive">
        <thead><tr><th>Section</th><th>Nombre</th></tr></thead>
        <tbody>
          <tr><td data-label="Section">Apports</td><td data-label="Nombre"><strong>${state.apports.length}</strong></td></tr>
          <tr><td data-label="Section">Bénéficiaires</td><td data-label="Nombre"><strong>${state.benefs.length}</strong></td></tr>
          <tr><td data-label="Section">Produits</td><td data-label="Nombre"><strong>${state.produits.length}</strong></td></tr>
          <tr><td data-label="Section">Achats</td><td data-label="Nombre"><strong>${state.achats.length}</strong></td></tr>
          <tr><td data-label="Section">Trades</td><td data-label="Nombre"><strong>${state.trades.length}</strong></td></tr>
          <tr><td data-label="Section">Ressources</td><td data-label="Nombre"><strong>${state.resources.length}</strong></td></tr>
          <tr><td data-label="Section">Cours lus</td><td data-label="Nombre"><strong>${state.courseProgress.length}</strong></td></tr>
        </tbody>
      </table>
    </div>
  `;
}

// ═════════════════════════════════════════════════════════
// MAIN RENDER
// ═════════════════════════════════════════════════════════

const renderers = {
  accueil: renderAccueil,
  portefeuille: renderPortefeuille,
  trading: renderTrading,
  apprendre: renderApprendre,
  reglages: renderReglages,
};

function rerender() {
  renderNavTabs();
  const main = document.getElementById('main');
  const fn = renderers[state.currentTab];
  if (fn) main.innerHTML = fn();
  else main.innerHTML = '<p>Section introuvable</p>';
}

function render() {
  rerender();
}

// Init au chargement
function init() {
  // Appliquer préférences sauvegardées
  document.documentElement.setAttribute('data-level', state.level);
  document.documentElement.setAttribute('data-contrast', state.contrast);
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.style.setProperty('--text-scale', state.textScale);
  
  // Mettre à jour pill de niveau
  setLevel(state.level);
  
  render();
}

document.addEventListener('DOMContentLoaded', init);
if (document.readyState !== 'loading') init();
</script>

</body>
